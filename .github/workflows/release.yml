name: Zbuduj i opublikuj Godziny Pracy

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Wersja, np. 1.0.2"
        required: true
        type: string
      version_code:
        description: "Rosnacy numer calkowity, np. 3"
        required: true
        type: string
      release_notes:
        description: "Krotki opis zmian"
        required: false
        default: "Nowa wersja aplikacji Godziny Pracy"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Skonfiguruj Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sprawdz sekrety podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Brak sekretu ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Brak sekretu ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Brak sekretu ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Brak sekretu ANDROID_KEY_PASSWORD" && exit 1)

      - name: Odtworz klucz podpisujacy
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/godziny-pracy-release.jks"

      - name: Zbuduj podpisany APK
        env:
          GODZINY_PRACY_VERSION_NAME: ${{ inputs.version_name }}
          GODZINY_PRACY_VERSION_CODE: ${{ inputs.version_code }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/godziny-pracy-release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Przygotuj pliki wydania
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/GodzinyPracy-${{ inputs.version_name }}.apk"
          cd release
          sha256sum "GodzinyPracy-${{ inputs.version_name }}.apk" > "GodzinyPracy-${{ inputs.version_name }}.apk.sha256"

      - name: Utworz GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Godziny Pracy ${{ inputs.version_name }}
          body: ${{ inputs.release_notes }}
          make_latest: true
          files: |
            release/GodzinyPracy-${{ inputs.version_name }}.apk
            release/GodzinyPracy-${{ inputs.version_name }}.apk.sha256
